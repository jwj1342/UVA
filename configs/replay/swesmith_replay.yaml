# Replay on SWE-smith: the collection's prompts, decoding, budget and bug-branch checkout; the
# replay driver sets the probe and the question per arm.
agent:
  force_ask_step: 12
  suppress_ask: false
  agent_class: "uva.agent.ask_probe.AskProbeAgent"
  cloud_reply: true
  max_ask_calls: 3
  system_template: |
    You are fixing a real Python bug, working on the machine that holds the repository.

    You are not working on this alone. A senior cloud engineer is on this task with you. You
    have the code, the shell, and the failing tests. They have seen this class of bug many
    times, but they cannot see your machine, run anything, or read your files. Between you,
    you have different halves of what it takes to fix this.

    CRITICAL: Every response MUST contain EXACTLY ONE command block — no more, no less:

    THOUGHT: one or two sentences explaining what you are doing

    ```mswea_bash_command
    your_command_here
    ```

    NEVER put two ```mswea_bash_command``` blocks in one response. ONE command, then wait for
    the output. Do NOT include other code blocks in your response.
    Working directory: /testbed (a new subshell each step, so no persistent state).

    TWO KINDS OF COMMAND go in that block:

    1. Any shell command, run on this machine:

       ```mswea_bash_command
       grep -rn "def resolve" /testbed/src
       ```

    2. `ask_expert`, which sends one self-contained question to the cloud engineer instead of
       running anything locally. Their reply comes back as the output of that command, so you
       can read it and act on it in your next step. You have three questions for this task:

       ```mswea_bash_command
       ask_expert "The failing test raises KeyError inside resolve(), but the only assignment
       to that key happens in the branch the traceback says was taken. What could make that
       key missing at that point?"
       ```

       They cannot see your machine, so the question has to carry what you observed, what you
       expected instead, and what you are uncertain about.
  instance_template: |
    Fix the following issue:

    {{task}}

    You drive the machine: reproduce the failure, edit the implementation, rerun the relevant
    checks, and consider edge cases. The cloud engineer is available throughout — while
    reproducing, while diagnosing, while choosing between approaches, or to check a fix before
    you submit it. Decide as you go which parts you handle alone and which are worth their
    input.

    When done, submit with these exact steps (separate commands):
    1. `git diff -- <files_you_changed> > patch.txt`
    2. Verify patch.txt looks correct
    3. `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT && cat patch.txt`

    Only include changed source files in the patch (no tests, no build files, no configs).
  step_limit: 75
  cost_limit: 0.

environment:
  cwd: "/testbed"
  timeout: 90
  interpreter: ["bash", "-c"]
  env:
    # the image's test environment first, as the grader uses it (`--cleanenv` skips the image's profile)
    PATH: "/opt/miniconda3/envs/testbed/bin:/opt/miniconda3/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"
  environment_class: singularity

model:
  model_name: "hosted_vllm/Qwen3.5-9B"
  model_class: "litellm_textbased"
  litellm_model_registry: "configs/registry.json"
  cost_tracking: "ignore_errors"
  model_kwargs:
    drop_params: true
    temperature: 0.8
    request_timeout: 300
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

# SWE-smith keeps each instance's bug on a branch named after it; start the agent on that branch.
run:
  env_startup_command: "cd /testbed && git checkout -f {{instance_id}} >/dev/null 2>&1 && test \"$(git rev-parse --abbrev-ref HEAD)\" = \"{{instance_id}}\""
