# ABLATION "DPO": the same accepted pairs as preferences (chosen q+, rejected q-), trained
# with DPO against a frozen reference (the base with the adapter disabled). Same adapter shape.
name: dpo
objective: dpo
data:
  pairs: output/pairs/master_pairs.jsonl
  max_pairs: 300
  char_budget: 9000
train:
  update_budget: 339                          # the same number of updates as Ours
  learning_rate: 5.0e-6
  beta: 0.1
  max_length: 3072
  max_prompt_length: 2816
  lora: {r: 16, alpha: 32, dropout: 0.05}      # on all linear projections of the nf4-quantized base
seed: 42
